<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8ed9ff" />
    <title>Town · Seaside Map Preview</title>
    <style>
      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(#9bdcff 0%, #c9edff 44%, #f8e6bb 100%);
      }
      body {
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/preview.js"></script>
  </body>
</html>
