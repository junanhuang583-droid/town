name: Vendor whale-girl sprite atlas

on:
  push:
    paths:
      - ".github/workflows/vendor-whale-girl.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned upstream sprite atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _reset/assets/whale-girl
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/f0909172434/deepseek-girl-codex-pet/2572709632b0e81401b9e92994f2c3786c186397/pet/spritesheet.webp" \
            -o _reset/assets/whale-girl/spritesheet.webp
          echo "234f24a97c18195a00c6093da0090773e675993c169e92e7e13a24c37b323fa2  _reset/assets/whale-girl/spritesheet.webp" | sha256sum -c -

      - name: Commit vendored atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _reset/assets/whale-girl/spritesheet.webp
          if git diff --cached --quiet; then
            echo "Atlas already vendored."
            exit 0
          fi
          git commit -m "Vendor whale-girl sprite atlas"
          git push
